# /etc/nginx/sites-available/tunnel.dilyor.dev
# Landing page from /var/www/tunnel-ai, relay API under /v1/.
# Certbot rewrites this file in place to add the TLS block and the :80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name tunnel.dilyor.dev;

    root /var/www/tunnel-ai;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header Connection      "";
        # Overwrite, never append: the relay rate-limits by the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;

        # `tunnel wait` long-polls for up to 55 s.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      90s;
        proxy_send_timeout      90s;

        # Files are capped at 10 MB by the relay.
        client_max_body_size 11m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
